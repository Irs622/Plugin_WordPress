name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend AI CI (Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build TypeScript
        working-directory: backend
        run: npm run build

      - name: Validate Knowledge Base & Sources
        working-directory: backend
        run: npm run kb:validate

      - name: Evaluate BM25 Retrieval Quality
        working-directory: backend
        run: npm run eval:retrieval

      - name: Run Backend Unit & Integration Tests
        working-directory: backend
        run: npm test

  plugin-ci:
    name: WordPress Plugin CI (PHP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, sqlite3, curl, zip, pdo_sqlite
          tools: composer
          coverage: none

      - name: Lint PHP Syntax
        run: |
          for f in $(find plugin/wp-knowledge-chat -name "*.php"); do
            php -l "$f" >/dev/null
          done
          echo "All PHP files passed syntax validation."

      - name: Install Test Tooling
        working-directory: plugin/wp-knowledge-chat/tests
        run: composer install --prefer-dist --no-progress --ignore-platform-req=php+

      - name: Check WordPress Coding Standards (PHPCS)
        working-directory: plugin/wp-knowledge-chat/tests
        run: vendor/bin/phpcs --standard=phpcs.xml.dist

      - name: Setup Disposable Local WordPress
        run: bash plugin/wp-knowledge-chat/tests/bin/setup-wp.sh

      - name: Run Plugin Tests (PHPUnit)
        working-directory: plugin/wp-knowledge-chat/tests
        run: vendor/bin/phpunit

  package-and-release:
    name: Package Plugin & Release Artifact
    needs: [backend-ci, plugin-ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP for Packaging Verification
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Build Plugin Distribution ZIP
        run: ./scripts/package-plugin.sh

      - name: Upload Plugin ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wp-knowledge-chat-plugin
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 14

      - name: Publish GitHub Release (on Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
