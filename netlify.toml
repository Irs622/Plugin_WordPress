[build]
  command = "cd backend && npm run build"
  publish = "backend/dist"

[functions]
  directory = "backend/dist/src/netlify"
  node_bundler = "esbuild"
  included_files = ["backend/data/kb.json", "data/kb.json"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

