[build]
  command = "cd backend && npm ci && npm run build"
  publish = "backend/public"  # static placeholder only; never publish dist/ (compiled sources, eval data)

[functions]
  directory = "backend/dist/src/netlify"
  node_bundler = "esbuild"
  included_files = ["backend/data/kb.json", "data/kb.json"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

